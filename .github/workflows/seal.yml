name: seal

on:
  push:
    branches: [main, seal-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdrant-e2e:
    name: qdrant-e2e (${{ matrix.qdrant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qdrant: ["v1.18.3", "v1.19.0"]
    services:
      qdrant:
        image: qdrant/qdrant:${{ matrix.qdrant }}
        ports:
          - 6333:6333
    env:
      MEMORYBRIDGE_E2E_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Real Qdrant write, MCP wire, fallback, snapshot, destructive restore drill
        run: pytest -vv tests/test_e2e_qdrant.py

  codex-contract:
    name: Codex 0.150.1 capture contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -U pip && pip install -e .
      - run: npm install --global @openai/codex@0.150.1
      - run: codex --version
      - name: Exercise official per-turn and SessionEnd payloads through MemoryBridge
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          transcript="$root/codex-session.jsonl"
          printf '%s\n' '{"type":"message","role":"user","content":"seal codex user"}' > "$transcript"
          printf '%s\n' '{"type":"message","role":"assistant","content":"seal codex assistant"}' >> "$transcript"
          export MEMORYBRIDGE_SPOOL_DIR="$root/spool"

          python - "$transcript" <<'PY' | memorybridge-codex-hook
          import json, sys
          print(json.dumps({
              "session_id": "seal-codex-session",
              "turn_id": "seal-turn-1",
              "transcript_path": sys.argv[1],
              "cwd": "/tmp",
              "hook_event_name": "UserPromptSubmit",
              "model": "seal-model",
              "permission_mode": "default",
              "prompt": "seal codex user",
          }))
          PY

          python - "$transcript" <<'PY' | memorybridge-codex-hook
          import json, sys
          print(json.dumps({
              "session_id": "seal-codex-session",
              "turn_id": "seal-turn-1",
              "transcript_path": sys.argv[1],
              "cwd": "/tmp",
              "hook_event_name": "Stop",
              "model": "seal-model",
              "permission_mode": "default",
              "stop_hook_active": False,
              "last_assistant_message": "seal codex assistant",
          }))
          PY

          test "$(find "$root/spool/pending" -name '*.json' | wc -l)" -eq 2

          python - "$transcript" <<'PY' | memorybridge-codex-hook
          import json, sys
          print(json.dumps({
              "session_id": "seal-codex-session",
              "transcript_path": sys.argv[1],
              "cwd": "/tmp",
              "hook_event_name": "SessionEnd",
              "reason": "other",
          }))
          PY
          test "$(find "$root/spool/transcript-jobs" -name '*.json' | wc -l)" -eq 1

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from memorybridge.config import Settings
          from memorybridge.spool import LocalSpool, materialize_transcript_jobs

          settings = Settings(spool_dir=Path(os.environ["MEMORYBRIDGE_SPOOL_DIR"]))
          spool = LocalSpool(settings.spool_dir)
          direct = [json.loads(path.read_text()) for path in spool.pending_paths()]
          assert {row["role"] for row in direct} == {"user", "assistant"}
          materialized, quarantined = materialize_transcript_jobs(settings)
          assert materialized == 1 and quarantined == 0
          assert len(spool.pending_paths()) >= 3
          print("Codex per-turn fsync + SessionEnd transcript reconciliation: PASS")
          PY

  openclaw-contract:
    name: OpenClaw ${{ matrix.openclaw }} plugin contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openclaw: ["2026.7.1-2", "2026.8.1-beta.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/openclaw/package.json
      - name: Install real published OpenClaw package
        working-directory: integrations/openclaw
        run: npm install --ignore-scripts --no-save openclaw@${{ matrix.openclaw }}
      - name: Load MemoryBridge plugin in isolated real OpenClaw runtime
        shell: bash
        working-directory: integrations/openclaw
        run: |
          set -euo pipefail
          export OPENCLAW_HOME="$(mktemp -d)"
          export OPENCLAW_STATE_DIR="$OPENCLAW_HOME/.openclaw"
          ./node_modules/.bin/openclaw plugins install "$GITHUB_WORKSPACE/integrations/openclaw" --force
          ./node_modules/.bin/openclaw plugins enable memorybridge
          if [[ "${{ matrix.openclaw }}" == "2026.7.1-2" ]]; then
            ./node_modules/.bin/openclaw plugins doctor
            ./node_modules/.bin/openclaw plugins list --verbose
          else
            ./node_modules/.bin/openclaw plugins doctor --json
            ./node_modules/.bin/openclaw plugins inspect memorybridge --runtime --json
          fi
      - name: Invoke real-shape hooks and verify fsynced capture
        run: node tests/contracts/openclaw.mjs

  hermes-contract:
    name: Hermes upstream ac6c802 plugin contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - name: Install MemoryBridge and pinned current Hermes source editable
        shell: bash
        run: |
          set -euo pipefail
          pip install -e .
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git /tmp/hermes
          git -C /tmp/hermes checkout ac6c8028e00d01ee2f299ba7fd03329c7f10382d
          pip install -e /tmp/hermes
      - name: Hermes native plugin doctor
        run: hermes plugins doctor integrations/hermes --ci
      - name: Real Hermes SessionDB -> MemoryBridge spool contract
        run: python tests/contracts/hermes.py
