[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybridge"
version = "0.1.0"
description = "Invisible, durable memory source and fallback retrieval fabric for AI agents over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MemoryBridge contributors"}]
keywords = ["mcp", "qdrant", "memory", "codex", "openclaw", "hermes", "agents"]
dependencies = [
  "mcp>=2.0,<3",
  "httpx>=0.27,<1",
  "httpx2>=2.9,<3",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
memorybridge = "memorybridge.cli:main"
memorybridge-server = "memorybridge.server:main"
memorybridge-worker = "memorybridge.worker:main"
memorybridge-codex-hook = "memorybridge.adapters:codex_hook_main"

[tool.setuptools.packages.find]
include = ["memorybridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
